name: Autonomous family graph synchronization

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: mncs-family-graph-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Commons main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check out declared semantic-graph participants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > "$RUNNER_TEMP/mncs-family-participants.tsv"
          import json
          from pathlib import Path

          participation = json.loads(Path("family/participation-v1.json").read_text())
          registry = json.loads(Path("src/mncs_commons/data/family-registry-v0alpha1.json").read_text())
          repositories = {item["id"]: item["repository"] for item in registry["projects"]}
          for item in sorted(participation["projects"], key=lambda row: row["id"]):
              if item["state"] == "participant":
                  print(item["id"], repositories[item["id"]], sep="\t")
          PY
          mkdir -p family
          while IFS=$'\t' read -r repository_id repository_url; do
            git clone --depth 1 --branch main "https://github.com/${repository_url#https://github.com/}.git" "family/$repository_id"
          done < "$RUNNER_TEMP/mncs-family-participants.tsv"
      - run: python -m pip install -e .
      - name: Validate current participant declarations
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r repository _; do
            python scripts/validate_semantic_declaration.py --root "$GITHUB_WORKSPACE/family/$repository"
          done < "$RUNNER_TEMP/mncs-family-participants.tsv"
      - name: Generate candidate graph and graph tests
        shell: bash
        run: |
          set -euo pipefail
          python scripts/reconcile_semantic_edges.py \
            --workspace "$GITHUB_WORKSPACE/family" \
            --output "$RUNNER_TEMP/semantic-edges-v1.json"
          python -m pytest -q tests/test_family_graph.py
      - name: Publish graph when changed
        shell: bash
        env:
          SYNC_BRANCH: automation/family-graph-sync
        run: |
          set -euo pipefail
          if cmp -s "$RUNNER_TEMP/semantic-edges-v1.json" family/semantic-edges-v1.json; then
            echo "family graph unchanged"
            exit 0
          fi
          # Refuse to publish a graph generated from an older main. The next
          # scheduled/manual run will regenerate against the moved head.
          git fetch origin main
          checked_out_main="$(git rev-parse HEAD)"
          current_main="$(git rev-parse origin/main)"
          if [ "$checked_out_main" != "$current_main" ]; then
            echo "Commons main moved during reconciliation; refusing stale publication" >&2
            exit 1
          fi
          cp "$RUNNER_TEMP/semantic-edges-v1.json" family/semantic-edges-v1.json
          git diff --check
          git config user.name "mncs-family-graph[bot]"
          git config user.email "mncs-family-graph[bot]@users.noreply.github.com"
          git add family/semantic-edges-v1.json
          git commit -m "chore: reconcile semantic family graph"
          if git push origin HEAD:main; then
            echo "published graph directly to main"
            exit 0
          fi
          echo "direct main publication refused; preparing a bounded PR"
          git fetch origin main "$SYNC_BRANCH" || true
          if [ "$(git rev-parse origin/main)" != "$checked_out_main" ]; then
            echo "Commons main moved during publication; refusing a stale synchronization PR" >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/remotes/origin/$SYNC_BRANCH"; then
            git switch --create "$SYNC_BRANCH" "origin/$SYNC_BRANCH"
            git merge --no-edit origin/main
            cp "$RUNNER_TEMP/semantic-edges-v1.json" family/semantic-edges-v1.json
            git add family/semantic-edges-v1.json
            git commit -m "chore: reconcile semantic family graph" || true
          else
            git switch --create "$SYNC_BRANCH" origin/main
            cp "$RUNNER_TEMP/semantic-edges-v1.json" family/semantic-edges-v1.json
            git add family/semantic-edges-v1.json
            git commit -m "chore: reconcile semantic family graph" || true
          fi
          git push origin "$SYNC_BRANCH"
          if gh pr list --base main --head "$SYNC_BRANCH" --state open --json number --jq 'length' | grep -qx '0'; then
            gh pr create --base main --head "$SYNC_BRANCH" \
              --title "chore: reconcile semantic family graph" \
              --body "Automated deterministic family graph reconciliation. The graph was generated from the Commons registry participation projection and current participant mains; no executable commands are carried in graph data."
          else
            echo "updated existing family graph synchronization PR"
          fi
