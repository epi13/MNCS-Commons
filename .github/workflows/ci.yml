name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,server]"
      - run: python -m compileall -q src
      - run: ruff check src tests scripts
      - run: mypy src
      - run: pytest -q
      - run: python scripts/validate_examples.py
      - run: python scripts/validate_pressures.py
      - run: python scripts/validate_compat.py
      - run: python -m mncs_commons.cli --help

  family-semantic-graph:
    name: Reconcile semantic family graph
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out Commons
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check out declared semantic-graph participants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > "$RUNNER_TEMP/mncs-family-participants.tsv"
          import json
          from pathlib import Path

          participation = json.loads(Path("family/participation-v1.json").read_text())
          registry = json.loads(Path("src/mncs_commons/data/family-registry-v0alpha1.json").read_text())
          repositories = {item["id"]: item["repository"] for item in registry["projects"]}
          for item in sorted(participation["projects"], key=lambda row: row["id"]):
              if item["state"] == "participant":
                  print(item["id"], repositories[item["id"]], sep="\t")
          PY
          mkdir -p family
          while IFS=$'\t' read -r repository_id repository_url; do
            git clone --depth 1 --branch main "https://github.com/${repository_url#https://github.com/}.git" "family/$repository_id"
          done < "$RUNNER_TEMP/mncs-family-participants.tsv"
      - run: python -m pip install -e .
      - name: Validate every declaration and its evidence
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r repository _; do
            python scripts/validate_semantic_declaration.py \
              --root "$GITHUB_WORKSPACE/family/$repository"
          done < "$RUNNER_TEMP/mncs-family-participants.tsv"
      - name: Reject a stale checked-in graph
        run: >-
          python scripts/reconcile_semantic_edges.py
          --workspace "$GITHUB_WORKSPACE/family"
          --check
