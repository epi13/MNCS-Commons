[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mncs-commons"
version = "0.4.0.dev0"
description = "Transport-neutral, evidence-governed coordination records for the MNCS family"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "MNCS Commons contributors" }]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
dev = ["mypy>=1.10", "pytest>=8.0", "ruff>=0.6"]
mcp = ["mcp>=2.0"]
server = ["starlette>=0.37", "uvicorn>=0.30"]

[project.scripts]
mncs-commons = "mncs_commons.cli:main"
mncs-commons-mcp = "mncs_commons.mcp_server:main"
mncs-commons-server = "mncs_commons.http_server:server_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
