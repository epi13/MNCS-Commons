[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mncs-commons"
version = "0.5.0.dev1"
description = "Transport-neutral, evidence-governed coordination records for the MNCS family"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "MNCS Commons contributors" }]
dependencies = [
  "zstandard>=0.22; python_version < '3.14'",
]

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
dev = ["mypy>=1.10", "pytest>=8.0", "ruff>=0.6"]
mcp = ["mcp>=1.29,<3"]
server = ["starlette>=0.37", "uvicorn>=0.30"]

[project.scripts]
mncs-commons = "mncs_commons.cli:main"
mncs-commons-mcp = "mncs_commons.mcp_server:main"
mncs-commons-server = "mncs_commons.http_server:server_main"
mncs-commons-service = "mncs_commons.service_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mncs_commons = [
  "data/*.json",
  "mesh/mncs/commons/mesh/*.mncs",
  "mesh/mncs/corpora/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
